[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"
[project]
name = "maritime-ai-hybrid-research"
version = "0.2.0"
description = "Synthetic maritime trajectory forecasting with GRU, LSTM, hybrid GRU and physics baseline"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.0", "matplotlib>=3.7"]
[tool.setuptools.packages.find]
where = ["src"]
